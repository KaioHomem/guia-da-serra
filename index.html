<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerenciador de tarefas acessível e responsivo feito com HTML, CSS e JavaScript.">
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- type="module" permite usar import/export entre os arquivos JS -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Link de pular conteúdo: quem navega pelo teclado vai direto ao principal (WCAG 2.4.1) -->
  <a class="pular-link" href="#conteudo">Pular para o conteúdo principal</a>

  <header class="cabecalho">
    <div class="container cabecalho__interno">
      <h1 class="cabecalho__titulo">Minhas Tarefas</h1>
      <!-- aria-pressed informa ao leitor de tela se o tema escuro está ligado -->
      <button type="button" id="botao-tema" class="botao botao--secundario" aria-pressed="false">
        Tema escuro
      </button>
    </div>
  </header>

  <main id="conteudo" class="container" tabindex="-1">
    <section class="cartao" aria-labelledby="titulo-nova">
      <h2 id="titulo-nova">Nova tarefa</h2>

      <form id="form-tarefa" class="form" novalidate>
        <div class="form__campo">
          <label for="campo-titulo">Descrição da tarefa <span aria-hidden="true">*</span></label>
          <input type="text" id="campo-titulo" name="titulo" maxlength="80"
                 required aria-required="true" aria-describedby="erro-titulo"
                 placeholder="Ex.: Estudar JavaScript" autocomplete="off">
          <!-- Mensagem de erro ligada ao campo via aria-describedby -->
          <p id="erro-titulo" class="form__erro" role="alert"></p>
        </div>

        <div class="form__campo">
          <label for="campo-prioridade">Prioridade</label>
          <select id="campo-prioridade" name="prioridade">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <button type="submit" class="botao botao--primario">Adicionar</button>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-lista">
      <div class="lista-topo">
        <h2 id="titulo-lista">Lista de tarefas</h2>
        <!-- Contador atualizado pelo JavaScript -->
        <p id="contador" class="contador">0 tarefas pendentes</p>
      </div>

      <nav aria-label="Filtrar tarefas">
        <ul class="filtros">
          <li><button type="button" class="filtro" data-filtro="todas" aria-pressed="true">Todas</button></li>
          <li><button type="button" class="filtro" data-filtro="pendentes" aria-pressed="false">Pendentes</button></li>
          <li><button type="button" class="filtro" data-filtro="concluidas" aria-pressed="false">Concluídas</button></li>
        </ul>
      </nav>

      <ul id="lista" class="lista"></ul>
      <p id="vazio" class="vazio" hidden>Nenhuma tarefa por aqui. Adicione uma acima!</p>

      <button type="button" id="botao-limpar" class="botao botao--perigo">
        Remover concluídas
      </button>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>Avaliação 02 – Desenvolvimento Web – IFSC Câmpus Lages – 2026</p>
    </div>
  </footer>

  <!-- Região "viva": o leitor de tela anuncia as mensagens colocadas aqui -->
  <div id="aviso" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
